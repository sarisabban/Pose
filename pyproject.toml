[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pose"
version = "1.0.0"
description = "Bare-metal Python library for building and manipulating protein, nucleic acid, and small-molecule structures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Sari Sabban", email = "sari.sabban@trubuild.io"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov",
  "pytest-benchmark",
  "hypothesis",
  "ruff",
  "mypy",
  "pre-commit",
  "asv",
  "cibuildwheel",
]
docs = [
  "sphinx",
  "myst-parser",
  "furo",
  "sphinx-copybutton",
  "sphinx-autoapi",
]
recipes = [
  "openmm",
  "rdkit",
  "openff-toolkit",
  "biopython",
]

[project.urls]
Homepage = "https://github.com/sarisabban/Pose"
Documentation = "https://sarisabban.github.io/Pose"
Repository = "https://github.com/sarisabban/Pose"
Issues = "https://github.com/sarisabban/Pose/issues"
Changelog = "https://github.com/sarisabban/Pose/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["pose*"]

[tool.setuptools.package-data]
pose = ["*.json"]

[tool.ruff]
line-length = 80
# Repo uses literal tabs per CLAUDE.md; ruff renders them as 4 visual cols.
indent-width = 4
# pose.py is the read-only golden core (constraint C1): exclude from lint.
extend-exclude = ["pose/pose.py"]

[tool.ruff.format]
indent-style = "tab"

[tool.mypy]
python_version = "3.12"
strict = false
# Phase 1 modularizes these into packages; for now they are flat modules.
files = ["pose/tools.py", "pose/energy.py"]
# Honor C1: pose.py is excluded from type-checking gates.
exclude = ["pose/pose\\.py$"]

[tool.pytest.ini_options]
addopts = "-W error --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["pose"]
# Per C1: pose.py is excluded from the coverage gate.
omit = ["pose/pose.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
