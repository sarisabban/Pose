name: Benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - "pose/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asv:
    name: asv compare main vs PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # asv needs the full history to compare against the base commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: asv machine
        run: asv machine --yes --machine github-ci
      - name: Run benchmarks (base vs HEAD)
        # `--factor 1.2` => fail if any benchmark regresses more than 20%.
        # `--no-only-changed` keeps the full suite so a regression that
        # happens to be on an unchanged file is still caught.
        run: |
          asv continuous \
            --no-only-changed \
            --factor 1.2 \
            --machine github-ci \
            ${{ github.event.pull_request.base.sha }} \
            ${{ github.event.pull_request.head.sha }}
      - name: Generate HTML
        if: always()
        run: asv publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asv-html
          path: benchmarks/html/
          retention-days: 14
